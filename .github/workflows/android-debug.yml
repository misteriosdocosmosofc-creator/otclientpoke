name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-debug:
    name: Build debug APK
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-build-android-apk.yml
    with:
      build_type: debug
    secrets:
      OTCLIENT_DEBUG_KEYSTORE_BASE64: ${{ secrets.OTCLIENT_DEBUG_KEYSTORE_BASE64 }}
