name: Reusable Android APK Build

on:
  workflow_call:
    inputs:
      build_type:
        description: Android Gradle build type
        required: false
        type: string
        default: release
    secrets:
      OTCLIENT_DEBUG_KEYSTORE_BASE64:
        required: false

permissions:
  contents: read
  pull-requests: read

env:
  JAVA_VERSION: "17"
  NDK_VERSION: "29.0.13599879"
  CMAKE_VERSION: "3.22.1"
  COMPILE_SDK: "36"
  BUILD_TOOLS_VERSION: "36.0.0"
  CI_ANDROID_ABIS: "armeabi-v7a"
  CI_VCPKG_TRIPLET: "arm64-android"
  LUAJIT_COMMIT: "d0e88930ddde28ff662503f9f20facf34f7265aa"
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_FEATURE_FLAGS: versions,binarycaching

concurrency:
  group: otclient-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Android ${{ inputs.build_type }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      # setup-android@v3 installs "tools platform-tools" by default.
      # The legacy "tools" package no longer exists in the SDK repository,
      # which makes sdkmanager exit 1 ("Failed to find package 'tools'").
      # Only install platform-tools here; the rest is installed explicitly below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install host build packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            curl \
            g++-multilib \
            gcc-multilib \
            git \
            make \
            ninja-build \
            pkg-config \
            python3 \
            unzip \
            zip

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error title=Missing Android SDK::ANDROID_SDK_ROOT or ANDROID_HOME must be set."
            exit 1
          fi

          sdkmanager --sdk_root="$sdk_root" --install \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          ndk_dir="$sdk_root/ndk/${NDK_VERSION}"
          if [[ ! -d "$ndk_dir" ]]; then
            ndk_dir="$(find "$sdk_root/ndk" -maxdepth 1 -type d -name "${NDK_VERSION}*" | sort | head -n 1)"
          fi
          if [[ -z "$ndk_dir" || ! -d "$ndk_dir" ]]; then
            echo "::error title=Missing Android NDK::NDK ${NDK_VERSION} was not installed."
            exit 1
          fi

          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_NDK_HOME=$ndk_dir"
            echo "ANDROID_NDK_ROOT=$ndk_dir"
          } >> "$GITHUB_ENV"

      - name: Read vcpkg baseline
        id: vcpkg
        run: |
          set -euo pipefail
          baseline="$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')"
          if [[ ! "$baseline" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid vcpkg baseline::vcpkg.json must contain a full 40-character builtin-baseline SHA."
            exit 1
          fi
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg checkout
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-${{ runner.os }}-${{ steps.vcpkg.outputs.baseline }}

      - name: Bootstrap vcpkg
        run: |
          set -euo pipefail
          if [[ ! -d "${VCPKG_ROOT}/.git" ]]; then
            git clone https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
          fi
          git -C "${VCPKG_ROOT}" fetch --depth 1 origin "${{ steps.vcpkg.outputs.baseline }}"
          git -C "${VCPKG_ROOT}" checkout "${{ steps.vcpkg.outputs.baseline }}"
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics

      - name: Export vcpkg GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('VCPKG_BINARY_SOURCES', 'clear;x-gha,readwrite');

      - name: Cache LuaJIT Android libraries
        id: luajit-cache
        uses: actions/cache@v4
        with:
          path: |
            luajit-src
            android/app/libs
          key: luajit-android-${{ runner.os }}-${{ env.CI_ANDROID_ABIS }}-ndk-${{ env.NDK_VERSION }}-${{ env.LUAJIT_COMMIT }}-${{ hashFiles('build_luajit_android.sh') }}

      - name: Fetch LuaJIT source
        if: steps.luajit-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone https://github.com/LuaJIT/LuaJIT.git luajit-src
          git -C luajit-src checkout "${LUAJIT_COMMIT}"

      - name: Build LuaJIT for Android
        if: steps.luajit-cache.outputs.cache-hit != 'true'
        env:
          OTCLIENT_ANDROID_ABIS: ${{ env.CI_ANDROID_ABIS }}
        run: |
          set -euo pipefail
          chmod +x build_luajit_android.sh
          ./build_luajit_android.sh

      - name: Pack game assets into data.zip
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          output = Path('android/app/src/main/assets/data.zip')
          roots = [Path('data'), Path('mods'), Path('modules')]
          files = [Path('init.lua'), Path('otclientrc.lua'), Path('cacert.pem'), Path('config.ini')]

          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              for root in roots:
                  if not root.exists():
                      raise SystemExit(f'Missing asset directory: {root}')
                  for path in sorted(root.rglob('*')):
                      if path.is_file():
                          archive.write(path, path.as_posix())
              for path in files:
                  if path.exists():
                      archive.write(path, path.as_posix())

          print(f'Wrote {output} ({output.stat().st_size} bytes)')
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Restore persistent development signing key
        env:
          OTCLIENT_DEBUG_KEYSTORE_BASE64: ${{ secrets.OTCLIENT_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$OTCLIENT_DEBUG_KEYSTORE_BASE64" ]]; then
            signing_dir="$RUNNER_TEMP/otclient-signing"
            mkdir -p "$signing_dir"
            printf '%s' "$OTCLIENT_DEBUG_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$signing_dir/debug.keystore"
            chmod 600 "$signing_dir/debug.keystore"
            echo "OTCLIENT_DEBUG_KEYSTORE=$signing_dir/debug.keystore" >> "$GITHUB_ENV"
          elif [[ '${{ inputs.build_type }}' == debug ]]; then
            echo '::warning::No persistent debug signing secret configured for this repository.'
          fi

      - name: Cache Android C/C++ compiler outputs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-android-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ env.CMAKE_VERSION }}-${{ env.CI_ANDROID_ABIS }}-${{ inputs.build_type }}-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**', 'overlay-ports/**', 'vcpkg.json') }}
          restore-keys: |
            ccache-android-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ env.CMAKE_VERSION }}-${{ env.CI_ANDROID_ABIS }}-${{ inputs.build_type }}-

      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          OTCLIENT_ANDROID_ABIS: ${{ env.CI_ANDROID_ABIS }}
          OTCLIENT_USE_CCACHE: "true"
          CCACHE_DIR: ${{ runner.temp }}/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 2G
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: ./gradlew ":app:assemble${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }}" --no-daemon --stacktrace --info

      - name: Show C/C++ compiler cache statistics
        if: always()
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: ccache --show-stats

      - name: List APK outputs
        run: find "android/app/build/outputs/apk/${{ inputs.build_type }}" -maxdepth 1 -type f -name "*.apk" -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: otclient-android-${{ inputs.build_type }}-${{ github.sha }}
          path: android/app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unstripped Native Libraries
        uses: actions/upload-artifact@v4
        with:
          name: android-native-symbols-${{ inputs.build_type }}-${{ github.sha }}
          path: |
            android/app/build/intermediates/cmake/${{ inputs.build_type }}/obj/**/*.so
            android/app/build/intermediates/cmake/Debug/obj/**/*.so
            android/app/build/intermediates/cxx/**/*.so
            android/app/.cxx/**/*.so
          if-no-files-found: error
          retention-days: 14

      - name: Write download summary
        run: |
          {
            echo "## Android ${{ inputs.build_type }} APK"
            echo ""
            echo "The APK was uploaded as the workflow artifact:"
            echo ""
            echo "- otclient-android-${{ inputs.build_type }}-${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
